<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PJO-DASHBOARD</title>
  <meta name="description" content="PJO Hauling Nikel - Control Dashboard">
  <meta name="theme-color" content="#0f172a">

  <!-- Fallback jika JavaScript tidak aktif -->
  <meta http-equiv="refresh" content="2;url=https://script.google.com/macros/s/AKfycbzlUYG63Ftr9X8Wu2Ni_b5kf0FNttzuDyFUslDmiTA-I8_pjg8iOtXOAt35aeKjBGOq_Q/exec">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #1e3a5f 0%, #0f172a 48%, #020617 100%);
      color: #fff;
    }

    .card {
      width: min(520px, 100%);
      padding: 34px 28px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      background: rgba(15, 23, 42, .78);
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
      backdrop-filter: blur(10px);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: rgba(249,115,22,.13);
      border: 1px solid rgba(249,115,22,.38);
      font-size: 34px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    p {
      margin: 0;
      color: #94a3b8;
      line-height: 1.6;
    }

    .spinner {
      width: 38px;
      height: 38px;
      margin: 24px auto 18px;
      border: 4px solid rgba(255,255,255,.14);
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    a {
      display: inline-block;
      margin-top: 14px;
      padding: 11px 18px;
      border-radius: 10px;
      background: #f97316;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }

    small {
      display: block;
      margin-top: 18px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon">📊</div>
    <h1>PJO-DASHBOARD</h1>
    <p>Membuka PJO Hauling Nikel Control Dashboard...</p>

    <div class="spinner"></div>

    <p style="font-size:13px;">
      Jika tidak terbuka otomatis, gunakan tombol di bawah.
    </p>

    <a href="https://script.google.com/macros/s/AKfycbzlUYG63Ftr9X8Wu2Ni_b5kf0FNttzuDyFUslDmiTA-I8_pjg8iOtXOAt35aeKjBGOq_Q/exec">
      Buka Dashboard
    </a>

    <small>Powered by Google Apps Script</small>
  </main>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbzlUYG63Ftr9X8Wu2Ni_b5kf0FNttzuDyFUslDmiTA-I8_pjg8iOtXOAt35aeKjBGOq_Q/exec";

    // Tidak memakai iframe.
    // Tidak memakai localStorage / sessionStorage / IndexedDB.
    setTimeout(() => {
      window.location.replace(APP_URL);
    }, 500);
  </script>
</body>
</html>
